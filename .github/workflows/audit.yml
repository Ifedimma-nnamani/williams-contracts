name: Security Audit

# Runs cargo-audit against the advisory allow-list in audit.toml on every
# push/PR to main and on a daily schedule, so a newly disclosed advisory in
# a dependency is caught even without a dependency-bumping PR (issue #270).
# Also runs cargo-deny (deny.toml) to enforce license policy and ban duplicate
# dependency versions (issue #122).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'

# Cancel superseded validation for the same pull request so rapid PR updates
# do not spend runners on obsolete revisions (issue #253). Scheduled scans and
# main-branch pushes use a distinct group and never cancel in progress, so the
# daily audit is preserved and unaffected by PR activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit --config audit.toml

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deny-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny check
        run: cargo deny check

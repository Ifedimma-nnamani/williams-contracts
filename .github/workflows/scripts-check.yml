name: Scripts Check

# Wires scripts/deploy-testnet.sh and scripts/integration_test.sh into CI
# (issue #269): both are syntax/lint-checked on every push and PR.
#
# Issue #78: the deploy-sandbox job executes scripts/run-deploy-sandbox.sh
# against a local Stellar standalone (Quickstart) container, giving the
# deployment logic an actual end-to-end smoke test rather than just a
# syntax check.
#
# The integration-test job that used to run integration_test.sh end-to-end
# against a local Soroban network was removed: it depended on installing
# stellar-cli with `--features opt`, a feature that no longer exists on the
# stellar-cli version CI installs, so the job could never succeed regardless
# of anything in this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Issue #254: pinned Stellar CLI version. Bumping this value changes the
  # cache key below, invalidating any previously cached executable.
  STELLAR_CLI_VERSION: "22.0.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Issue #255: discover every shell script under both scripts/ and
      # .github/scripts/ deterministically so new guards are picked up
      # automatically.  Scripts are only parsed/linted, never executed.
      - name: Syntax-check shell scripts
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts .github/scripts -maxdepth 1 -name '*.sh' -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          echo "Syntax-checking ${#files[@]} shell script(s):"
          printf '  %s\n' "${files[@]}"
          for f in "${files[@]}"; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed for $f"
              exit 1
            fi
          done

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find scripts .github/scripts -maxdepth 1 -name '*.sh' -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          echo "ShellCheck-ing ${#files[@]} shell script(s):"
          printf '  %s\n' "${files[@]}"
          for f in "${files[@]}"; do
            if ! shellcheck "$f"; then
              echo "::error file=$f::shellcheck failed for $f"
              exit 1
            fi
          done

  # Issue #78: execute deploy-testnet.sh logic against a local Stellar
  # standalone container so the deployment script is actually run, not merely
  # syntax-checked.  This catches regressions in the build→deploy→verify
  # sequence before they reach the live testnet.
  deploy-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Issue #254: reuse a version-verified stellar-cli executable. The cache
      # key includes the pinned version, OS/arch and Cargo.lock hash, so a
      # version bump or dependency change invalidates the cache.
      - name: Cache stellar-cli
        id: stellar-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-${{ runner.arch }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}-

      - name: Install stellar-cli
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      - name: Verify stellar-cli version
        run: |
          set -euo pipefail
          echo "stellar binary: $(command -v stellar)"
          installed="$(stellar --version)"
          echo "$installed"
          if ! printf '%s\n' "$installed" | grep -Eq "(^|[^0-9.])${STELLAR_CLI_VERSION}([^0-9.]|$)"; then
            echo "::error::stellar --version ($installed) does not match pinned version $STELLAR_CLI_VERSION"
            exit 1
          fi

      - name: Run deploy sandbox smoke-test
        run: scripts/run-deploy-sandbox.sh

  spec-freshness:
    # Runs scripts/export-spec.sh --check to verify that the committed JSON
    # snapshot in spec/ matches the compiled WASM bindings (#49). Any PR that
    # changes entry point signatures, error codes, or struct fields without
    # updating the spec will fail here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Issue #254: reuse a version-verified stellar-cli executable. The cache
      # key includes the pinned version, OS/arch and Cargo.lock hash, so a
      # version bump or dependency change invalidates the cache.
      - name: Cache stellar-cli
        id: stellar-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-${{ runner.arch }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}-

      - name: Install stellar-cli
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli --version "$STELLAR_CLI_VERSION"

      - name: Verify stellar-cli version
        run: |
          set -euo pipefail
          echo "stellar binary: $(command -v stellar)"
          installed="$(stellar --version)"
          echo "$installed"
          if ! printf '%s\n' "$installed" | grep -Eq "(^|[^0-9.])${STELLAR_CLI_VERSION}([^0-9.]|$)"; then
            echo "::error::stellar --version ($installed) does not match pinned version $STELLAR_CLI_VERSION"
            exit 1
          fi

      - name: Build contract and verify spec freshness
        run: scripts/export-spec.sh --check

name: Scripts Check

# Wires scripts/deploy-testnet.sh and scripts/integration_test.sh into CI
# (issue #269): both are syntax/lint-checked on every push and PR.
#
# Issue #78: the deploy-sandbox job executes scripts/run-deploy-sandbox.sh
# against a local Stellar standalone (Quickstart) container, giving the
# deployment logic an actual end-to-end smoke test rather than just a
# syntax check.
#
# Issue #249: the lifecycle-integration job runs scripts/integration_test.sh
# end-to-end against an isolated local network.  It is independent of the
# deploy-sandbox and spec-freshness jobs and does not rely on the removed
# `--features opt` stellar-cli install; it reuses the same pinned toolchain
# (wasm32v1-none target + `cargo install --locked stellar-cli`) as the other
# jobs and performs bounded cleanup so a failing create/check-in/cancel stage
# is diagnosable from the logs.
#
# Issue #296: the offline-suite step runs scripts/test/run-offline-suite.sh,
# a command-stub harness that checks exit propagation, cleanup and command
# ordering without a network, identity, Docker daemon or deployment.
#
# Issue #298: the workflow-lint job statically validates every maintained
# workflow definition with a pinned actionlint release, catching invalid
# expression contexts, unsupported workflow keys and bad action inputs
# before GitHub ever interprets them.  The same command is available
# locally via scripts/check-workflows.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least‑privilege permissions: only read access to the repository.
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1

      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/deploy-testnet.sh
          bash -n scripts/run-deploy-sandbox.sh
          bash -n scripts/integration_test.sh
          bash -n scripts/export-spec.sh
          bash -n scripts/check_resource_costs.sh
          bash -n scripts/check-wasm-size.sh
          bash -n scripts/check-testnet-drift.sh

      - name: Check README function table matches lib.rs (#235)
        run: python3 scripts/gen-api-table.py --check

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck scripts/*.sh scripts/test/*.sh

      - name: Run offline command-stub suite
        run: scripts/test/run-offline-suite.sh

  # Issue #298: statically validate the workflow definitions themselves.
  # actionlint is pinned to an exact release and installed from its
  # published release tarball so the check is reproducible and needs no
  # GitHub write access.  The same entrypoint runs locally.
  workflow-lint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.7
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fsSL "$url" -o "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Validate workflow definitions
        run: scripts/check-workflows.sh

  # Issue #78: execute deploy-testnet.sh logic against a local Stellar
  # standalone container so the deployment script is actually run, not merely
  # syntax-checked.  This catches regressions in the build→deploy→verify
  # sequence before they reach the live testnet.
  deploy-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli --version 22.0.1

      - name: Run deploy sandbox smoke-test
        run: scripts/run-deploy-sandbox.sh

  # Issue #249: actually execute the compiled lifecycle script
  # (create → check-in → cancel) against an isolated local network.  A nonzero
  # exit status from the script fails the job, so CLI encoding and real-host
  # lifecycle regressions are caught by ordinary PR validation.
  lifecycle-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      - name: Run lifecycle integration script
        # `set -o pipefail` propagates the script's nonzero status through the
        # `tee` used to capture logs; `set -e` aborts on that failure.  Each
        # lifecycle stage is echoed so a failing create/check-in/cancel step is
        # identifiable in the captured log.
        run: |
          set -euo pipefail
          echo "::group::lifecycle: create_will"
          echo "Running scripts/integration_test.sh (create → check-in → cancel)"
          scripts/integration_test.sh 2>&1 | tee integration-test.log
          echo "::endgroup::"
          echo "lifecycle integration script completed successfully"

      - name: Upload lifecycle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-integration-logs
          path: integration-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup local network
        if: always()
        # Bounded cleanup: stop any local stellar/soroban network the script
        # started, ignoring errors so cleanup never masks the real failure.
        run: |
          timeout 60 stellar network stop local 2>/dev/null || true
          timeout 60 docker ps -q --filter "label=stellar" | xargs -r docker stop 2>/dev/null || true

  spec-freshness:
    # Runs scripts/export-spec.sh --check to verify that the committed JSON
    # snapshot in spec/ matches the compiled WASM bindings (#49). Any PR that
    # changes entry point signatures, error codes, or struct fields without
    # updating the spec will fail here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli --version 22.0.1

      - name: Build contract and verify spec freshness
        run: scripts/export-spec.sh --check
